name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # SVG rendering for crisp brand and social icons
  flutter_svg: ^2.0.17

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  go_router: ^18.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geist-Black.ttf
          weight: 900
        - asset: assets/fonts/Geist-Italic.ttf
          style: italic
