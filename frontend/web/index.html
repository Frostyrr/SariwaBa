<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EEF6F5">
  <meta name="description" content="SariwaBa — Instant fish freshness inspection for eye and gill close-ups.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SariwaBa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="104697469786-jjf8bei38i7c535in3fgc4vppifv8aem.apps.googleusercontent.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SariwaBa — Fish Freshness</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #EEF6F5;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #sariwa-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #EEF6F5;
      transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #sariwa-boot.sariwa-boot--done {
      opacity: 0;
      pointer-events: none;
    }

    .sariwa-boot__badge {
      width: 72px;
      height: 72px;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 20px;
      background: #FFFFFF;
      border: 1px solid #D8E7E7;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: sariwaPulse 2.2s ease-in-out infinite;
    }

    .sariwa-boot__badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .sariwa-boot__title {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.4px;
      color: #0A2229;
    }

    .sariwa-boot__track {
      margin-top: 16px;
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: #D8E7E7;
      overflow: hidden;
      position: relative;
    }

    .sariwa-boot__bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 44%;
      border-radius: 999px;
      background: #168077;
      animation: sariwaSlide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes sariwaPulse {
      0%, 100% { transform: scale(0.98); }
      50% { transform: scale(1.02); }
    }

    @keyframes sariwaSlide {
      0% { left: -44%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sariwa-boot__badge { animation: none; }
      .sariwa-boot__bar { animation: none; left: 28%; }
    }
  </style>
</head>
<body>
  <div id="sariwa-boot" role="status" aria-live="polite" aria-label="Loading SariwaBa">
    <div class="sariwa-boot__badge">
      <img src="icons/Icon-192.png" alt="SariwaBa logo" />
    </div>
    <div class="sariwa-boot__title">SariwaBa</div>
    <div class="sariwa-boot__track">
      <div class="sariwa-boot__bar"></div>
    </div>
  </div>

  <script>
    (function () {
      function dismissBootLoader() {
        var el = document.getElementById('sariwa-boot');
        if (!el || el.classList.contains('sariwa-boot--done')) return;
        el.classList.add('sariwa-boot--done');
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 300);
      }
      window.addEventListener('flutter-first-frame', dismissBootLoader, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
