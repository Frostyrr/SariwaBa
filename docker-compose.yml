services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: sariwaba_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-sariwaba_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sariwaba_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django REST Framework Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sariwaba_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Live-mount backend code for instant hot-reloading
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Inside Docker container network, Django reaches PostgreSQL via service name 'db'
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
